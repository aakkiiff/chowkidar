server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options   "nosniff"           always;
    add_header X-Frame-Options          "DENY"              always;
    add_header X-XSS-Protection         "1; mode=block"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    # CSP: allow Google Fonts stylesheet + woff files (Inter, JetBrains Mono).
    # Tradeoff: extra third-party origin. Acceptable since fonts are static and Google
    # serves them over HTTPS with subresource integrity guarantees.
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self'; font-src 'self' https://fonts.gstatic.com data:; frame-ancestors 'none';" always;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
