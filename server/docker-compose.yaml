services:
  server:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    # App config lives next to the service. One source of truth.
    env_file:
      - .env
    environment:
      # ── Go runtime tuning ──────────────────────────────────────────────
      # GOMEMLIMIT: soft heap ceiling. Triggers GC earlier as heap approaches
      # this value, keeps RSS flat under pressure. Set ~80% of the memory
      # limit below.
      GOMEMLIMIT: 128MiB
      # GOGC: garbage collector target. Default 100 (double heap between GCs).
      # 50 = more frequent GCs, lower steady-state RSS, ~5-8% extra CPU.
      GOGC: "50"
      # GOMAXPROCS: worker threads. Monitoring workload is IO-bound; 2 is
      # plenty and avoids scheduler contention on high-core hosts.
      GOMAXPROCS: "2"
    # Hard caps let you verify the Go runtime tuning is keeping RSS in budget.
    # If the server OOMs here, raise GOMEMLIMIT/memory in lockstep.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 160M
        reservations:
          cpus: "0.05"
          memory: 32M
