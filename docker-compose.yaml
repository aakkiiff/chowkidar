services:
  server:
    build: ./server
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_PORT: "8080"
      JWT_SECRET: MMENnn5vCvKALTQin8ZWh91kwN45cxT/NDgftdc4jGg=
      DB_PATH: ./db/chowkidar.db
      RETENTION_DAYS_CONTAINERS: "7"
      RAW_RETENTION_MINUTES: "5"
      LOG_DIR: ./db/logs
      LOG_RETENTION_DAYS: "5"
      LOG_MAX_FILE_MB: "200"
      LOG_MAX_ROTATIONS: "1"
      GOMEMLIMIT: 100MiB
      GOGC: "50"
      GOMAXPROCS: "1"
    volumes:
      - chowkidar_data:/app/db

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 100M

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5173:80"

    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 50M

volumes:
  chowkidar_data:
