services:
  server:
    build: ./server
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    environment:
      GOMEMLIMIT: 100MiB
      GOGC: "50"
      GOMAXPROCS: "1"
    volumes:
      - chowkidar_data:/app/db

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 100M

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5173:80"

    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 50M

volumes:
  chowkidar_data:
