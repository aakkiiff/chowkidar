services:
  server:
    build: ./server
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    environment:
      GOMEMLIMIT: 100MiB
      GOGC: "50"
      GOMAXPROCS: "1"
    volumes:
      - chowkidar_data:/app/db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 100M

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 50M

volumes:
  chowkidar_data:
