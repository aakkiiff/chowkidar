services:
  server:
    # image: 
    build: ./server
    restart: always
    ports:
      - "8080:8080"
    # App config lives next to the service. One source of truth.
    env_file:
      - ./server/.env
    environment:
      GOMEMLIMIT: 100MiB
      GOGC: "50"
      GOMAXPROCS: "1"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 100M


  frontend:
    # image: imageName
    build: ./frontend
    restart: always
    ports:
      - "5173:80"

    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 50M
